services:
  - type: web
    name: ebook-sales
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DELIVERY_SECRET
        generateValue: true
      - key: PDF_PATH
        value: /opt/render/project/src/ebook.pdf
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
